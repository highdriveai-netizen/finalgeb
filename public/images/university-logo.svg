<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none">
  <!-- Official University of Chittagong Emblem (চট্টগ্রাম বিশ্ববিদ্যালয়) -->
  <g fill="#064e3b" stroke="#064e3b">
    <!-- Main Outer Arch/Shield with top finials -->
    <path d="M 195 25 C 190 80, 160 160, 80 200 C 35 235, 15 310, 15 420 C 15 540, 85 625, 250 685 C 415 625, 485 540, 485 420 C 485 310, 465 235, 420 200 C 340 160, 310 80, 305 25 L 285 25 C 285 100, 315 160, 375 190 C 420 215, 445 280, 445 390 C 445 490, 395 565, 250 625 C 105 565, 55 490, 55 390 C 55 280, 80 215, 125 190 C 185 160, 215 100, 215 25 Z" fill="#064e3b" />

    <!-- Top Center Triangle Frame -->
    <path d="M 250 85 L 175 240 L 325 240 Z" fill="none" stroke="#064e3b" stroke-width="14" stroke-linejoin="round" />
    <!-- Arabic Calligraphy "Rabbi Zidni Ilma" (رَبِّ زِدْنِي عِلْمًا) representation -->
    <g transform="translate(250, 175)" fill="#064e3b" stroke="none">
      <path d="M -5 -50 C -5 -60, 5 -60, 5 -50 L 5 -20 C 15 -20, 20 -25, 20 -35 L 26 -35 C 26 -15, 12 -12, 0 -12 C -12 -12, -26 -15, -26 -35 L -20 -35 C -20 -25, -15 -20, -5 -20 Z" />
      <circle cx="-16" cy="-45" r="3.5" />
      <circle cx="16" cy="-45" r="3.5" />
      <path d="M -25 0 Q 0 -15 25 0 Q 35 15 20 25 Q -5 20 -25 20 Q -40 15 -25 0 Z" />
      <path d="M -15 35 Q 0 25 15 35 Q 25 45 10 50 Q -10 50 -20 40 Z" />
    </g>

    <!-- Horizontal Separator Bar -->
    <rect x="75" y="248" width="350" height="14" rx="2" fill="#064e3b" />

    <!-- Middle Left Frame: Open Book with Radiant Sun Rays -->
    <rect x="80" y="272" width="160" height="175" rx="6" fill="none" stroke="#064e3b" stroke-width="12" />
    <!-- Open Book -->
    <g transform="translate(160, 380)">
      <path d="M 0 15 Q -25 5 -52 18 L -52 -35 Q -25 -48 0 -38 Q 25 -48 52 -35 L 52 18 Q 25 5 0 15 Z" fill="none" stroke="#064e3b" stroke-width="7" stroke-linejoin="round" />
      <line x1="0" y1="-38" x2="0" y2="15" stroke="#064e3b" stroke-width="6" />
      <!-- Book spine & pages lines -->
      <path d="M -44 -20 Q -22 -32 0 -24" stroke="#064e3b" stroke-width="3" fill="none" />
      <path d="M -44 -5 Q -22 -17 0 -9" stroke="#064e3b" stroke-width="3" fill="none" />
      <path d="M 44 -20 Q 22 -32 0 -24" stroke="#064e3b" stroke-width="3" fill="none" />
      <path d="M 44 -5 Q 22 -17 0 -9" stroke="#064e3b" stroke-width="3" fill="none" />
      <!-- Rising Rays from the book -->
      <line x1="0" y1="-45" x2="0" y2="-75" stroke="#064e3b" stroke-width="4.5" stroke-linecap="round" />
      <line x1="-15" y1="-44" x2="-26" y2="-70" stroke="#064e3b" stroke-width="4" stroke-linecap="round" />
      <line x1="15" y1="-44" x2="26" y2="-70" stroke="#064e3b" stroke-width="4" stroke-linecap="round" />
      <line x1="-30" y1="-40" x2="-48" y2="-62" stroke="#064e3b" stroke-width="4" stroke-linecap="round" />
      <line x1="30" y1="-40" x2="48" y2="-62" stroke="#064e3b" stroke-width="4" stroke-linecap="round" />
      <line x1="-40" y1="-32" x2="-62" y2="-48" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" />
      <line x1="40" y1="-32" x2="62" y2="-48" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Middle Right Frame: Atom / Science Symbol with Orbits -->
    <rect x="260" y="272" width="160" height="175" rx="6" fill="none" stroke="#064e3b" stroke-width="12" />
    <!-- Atom & Nucleus -->
    <g transform="translate(340, 360)">
      <circle cx="0" cy="0" r="14" fill="#064e3b" />
      <!-- 3 Orbital Ellipses -->
      <ellipse cx="0" cy="0" rx="60" ry="24" fill="none" stroke="#064e3b" stroke-width="6.5" />
      <ellipse cx="0" cy="0" rx="60" ry="24" transform="rotate(60)" fill="none" stroke="#064e3b" stroke-width="6.5" />
      <ellipse cx="0" cy="0" rx="60" ry="24" transform="rotate(120)" fill="none" stroke="#064e3b" stroke-width="6.5" />
    </g>

    <!-- Middle Horizontal Separator Bar -->
    <rect x="75" y="458" width="350" height="14" rx="2" fill="#064e3b" />

    <!-- 3 Triangular Mountain Peaks (Chittagong Hills) -->
    <g transform="translate(250, 508)">
      <polygon points="-130,12 -80,-35 -30,12" fill="#064e3b" />
      <polygon points="-50,12 0,-35 50,12" fill="#064e3b" />
      <polygon points="30,12 80,-35 130,12" fill="#064e3b" />
    </g>

    <!-- Bar separator below hills -->
    <rect x="95" y="528" width="310" height="10" rx="2" fill="#064e3b" />

    <!-- 5 Linked Wave / Boat Hull Diamonds (Maritime Symbol) -->
    <g transform="translate(250, 560)">
      <path d="M -115 0 L -95 -14 L -75 0 L -95 14 Z" fill="none" stroke="#064e3b" stroke-width="7" stroke-linejoin="round" />
      <path d="M -60 0 L -40 -14 L -20 0 L -40 14 Z" fill="none" stroke="#064e3b" stroke-width="7" stroke-linejoin="round" />
      <path d="M -5 0 L 15 -14 L 35 0 L 15 14 Z" fill="none" stroke="#064e3b" stroke-width="7" stroke-linejoin="round" />
      <path d="M 50 0 L 70 -14 L 90 0 L 70 14 Z" fill="none" stroke="#064e3b" stroke-width="7" stroke-linejoin="round" />
      <path d="M 105 0 L 125 -14 L 145 0 L 125 14 Z" fill="none" stroke="#064e3b" stroke-width="7" stroke-linejoin="round" />
    </g>

    <!-- Bottom Curved Text Ribbon: চট্টগ্রাম বিশ্ববিদ্যালয় -->
    <g transform="translate(250, 642)">
      <text text-anchor="middle" font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', system-ui, sans-serif" font-weight="900" font-size="28" fill="#064e3b" letter-spacing="1.5">
        চট্টগ্রাম বিশ্ববিদ্যালয়
      </text>
    </g>
  </g>
</svg>
