<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>International Biotechnology Conference 2027</title>
    <script>
      // Single Page Apps for GitHub Pages & static web servers
      // Store current path and redirect to index.html with query parameter
      var path = window.location.pathname;
      var query = window.location.search;
      var hash = window.location.hash;
      
      // Store full destination path
      sessionStorage.setItem('redirect', path + query + hash);
      
      // Also provide URL query fallback
      window.location.replace('/?p=' + encodeURIComponent(path + query + hash));
    </script>
  </head>
  <body>
    <p>Redirecting to International Biotechnology Conference 2027…</p>
  </body>
</html>
